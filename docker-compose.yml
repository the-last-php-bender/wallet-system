services:
  wallet-mysql:
    image: mysql:8.0
    container_name: wallet_mysql_8
    restart: unless-stopped
    hostname: wallet-mysql
    environment:
      MYSQL_DATABASE: wallet_engine
      MYSQL_USER: wallet_user
      MYSQL_PASSWORD: walletsecretpassword
      MYSQL_ROOT_PASSWORD: rootpassword
      TZ: UTC
    ports:
      - '3306:3306'
    volumes:
      - wallet_mysql_data:/var/lib/mysql
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_connections=200
      --innodb_buffer_pool_size=128M
      --innodb_log_file_size=64M
      --innodb_flush_log_at_trx_commit=2
      --transaction-isolation=READ-COMMITTED
      --lock_wait_timeout=10
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "wallet_user", "-pwalletsecretpassword"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - wallet_network
    deploy:
      resources:
        limits:
          cpus: '2.000'
          memory: 1024M
        reservations:
          cpus: '0.500'
          memory: 256M

volumes:
  wallet_mysql_data:
    driver: local

networks:
  wallet_network:
    name: wallet_network
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
