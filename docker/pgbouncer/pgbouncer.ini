[databases]
wallet_engine = host=wallet-db port=5432 dbname=wallet_engine

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432

pool_mode = transaction
max_client_conn = 200
max_db_connections = 100
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 5

server_lifetime = 3600
server_idle_timeout = 600
server_connect_timeout = 15
server_login_retry = 3

query_timeout = 30000
query_wait_timeout = 30000
idle_transaction_timeout = 300000
client_login_timeout = 30

sodbci_timeout = 60
pkt_len = 0

auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
auth_query = SELECT usename, passwd FROM pg_shadow WHERE usename = $1

server_reset_query = DISCARD ALL
server_check_delay = 30
server_check_query = SELECT 1
server_connect_query = SELECT 1

log_connections = 0
log_disconnections = 0
log_pooler_errors = 1

syslog = off
logfile = /var/log/pgbouncer/pgbouncer.log
pidfile = /var/run/pgbouncer/pgbouncer.pid

admin_users = wallet_admin
stats_users = wallet_stats